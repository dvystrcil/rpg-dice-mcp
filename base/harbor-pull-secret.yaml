# Pull secret for Harbor (harbor.sirddail.net/ai/rpg-dice-mcp).
# Projected from Infisical via InfisicalSecret CR per
# feedback_secret_manifest_in_repo_is_not_hardening — no plaintext
# secret values in this repo.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: rpg-dice-mcp-harbor-pull
  namespace: rpg-dice-mcp
spec:
  hostAPI: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: homelab-bz-gt
        envSlug: prod
        secretsPath: "/harbor-pull"
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: infisical
  managedSecretReference:
    secretName: rpg-dice-mcp-harbor-pull
    secretNamespace: rpg-dice-mcp
    secretType: kubernetes.io/dockerconfigjson
    creationPolicy: Owner
