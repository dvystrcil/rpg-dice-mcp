apiVersion: v1
kind: Namespace
metadata:
  name: rpg-dice-mcp
  labels:
    app.kubernetes.io/part-of: homelab-mcp
    # Per gateway-services chart convention: the gateway needs to
    # reach the Service from istio-system. Label here so the chart's
    # multi-source HTTPRoute selector matches.
    istio.io/dataplane-mode: ambient
