# Harbor pull credentials for the rpg-dice-mcp namespace.
#
# InfisicalSecret CR per the homelab-secrets convention — NEVER commit
# literal stringData/data for credentials. Infisical operator
# materializes this into a kubernetes.io/dockerconfigjson Secret named
# `rpg-dice-mcp-harbor-pull` that the Deployment references via
# imagePullSecrets.
#
# Pattern copied verbatim from mcp-server / kroger-mcp / mealie-mcp /
# open-terminal — same Infisical project + path + template shape. The
# only thing that changes per namespace is the secretName.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: rpg-dice-mcp-harbor-pull
  namespace: rpg-dice-mcp
  labels:
    app.kubernetes.io/name: rpg-dice-mcp
    app.kubernetes.io/part-of: homelab-mcp
spec:
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-machine-identity
        secretNamespace: infisical-operator
      secretsScope:
        envSlug: prod
        projectSlug: homelab-bz-gt
        recursive: false
        secretsPath: /
  hostAPI: https://infisical.sirddail.net/api
  managedSecretReference:
    creationPolicy: Orphan
    secretName: rpg-dice-mcp-harbor-pull
    secretNamespace: rpg-dice-mcp
    secretType: kubernetes.io/dockerconfigjson
    template:
      data:
        .dockerconfigjson: '{"auths":{"{{ .HB_REGISTRY.Value }}":{"username":"{{ .HB_USERNAME.Value }}","password":"{{ .HB_PASSWORD.Value }}","auth":"{{ .HB_AUTH.Value }}"},"harbor-core.harbor.svc.cluster.local":{"username":"{{ .HB_USERNAME.Value }}","password":"{{ .HB_PASSWORD.Value }}","auth":"{{ .HB_AUTH.Value }}"}}}'
      includeAllSecrets: false
  resyncInterval: 60
